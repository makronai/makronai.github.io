<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <link rel="stylesheet" href="nexus.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/feed.js" defer></script>
    <script src="js/chat.js" defer></script>
    <script src="js/profile.js" defer></script>
</head>
<body>
    <div id="app-layout" class="hidden">
        
        <nav class="flex col border-r bg-base h-full py-3 px-4 justify-between">
            <div class="flex col gap-4">
                <div class="text-xl font-bold p-2 text-accent">NEXUS</div>
                <div class="flex row items-center gap-4 p-2 rounded-full hover-bg cursor-pointer transition text-xl" onclick="switchView('feed')">
                    <span>🏠</span> <span class="nav-text">Home</span>
                </div>
                <div class="flex row items-center gap-4 p-2 rounded-full hover-bg cursor-pointer transition text-xl" onclick="switchView('chat')">
                    <span>💬</span> <span class="nav-text">Messages</span>
                </div>
                <div class="flex row items-center gap-4 p-2 rounded-full hover-bg cursor-pointer transition text-xl" onclick="switchView('profile')">
                    <span>👤</span> <span class="nav-text">Profile</span>
                </div>
                <button class="btn btn-accent rounded-full w-full mt-4 nav-text">Post</button>
            </div>
            
            <div class="flex row items-center gap-2 p-2 rounded-full hover-bg cursor-pointer transition" id="current-user-menu">
                <div class="avatar rounded-full border-all" id="nav-avatar"></div>
                <div class="flex col nav-text">
                    <span class="font-bold" id="nav-username">Loading...</span>
                    <span class="text-muted" id="nav-handle">@user</span>
                </div>
            </div>
        </nav>

        <main class="flex col h-full border-r relative" id="main-viewport">
            
            <header class="flex row items-center p-4 border-b glass" style="position: sticky; top: 0; z-index: 10;">
                <h2 class="font-bold text-xl" id="view-title">Home</h2>
            </header>

            <div id="view-feed" class="flex-1 col overflow-y-auto w-full">
                <div class="flex row gap-4 p-4 border-b">
                    <div class="avatar rounded-full" id="composer-avatar"></div>
                    <div class="flex col flex-1 gap-2">
                        <textarea class="input-ghost" placeholder="What's happening?" rows="2" id="post-input"></textarea>
                        <div class="flex row justify-between items-center border-t py-2">
                            <span class="text-accent cursor-pointer">📎 Media</span>
                            <button class="btn btn-accent rounded-full" onclick="NexusFeed.createPost()">Post</button>
                        </div>
                    </div>
                </div>
                <div id="feed-stream" class="flex col"></div>
            </div>

            <div id="view-chat" class="flex-1 col hidden h-full">
                <div id="message-stream" class="flex-1 col p-4 gap-4 overflow-y-auto"></div>
                <div class="p-4 border-t bg-base">
                    <div class="flex row items-center gap-2 bg-surface p-2 rounded-lg border-all">
                        <input type="text" class="input-ghost px-2" placeholder="Message #general" id="msg-input">
                        <button class="btn btn-accent rounded-lg" onclick="NexusChat.sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </main>

        <aside id="right-sidebar" class="flex col h-full bg-base p-4 gap-4">
            <div class="bg-surface rounded-lg p-4 border-all flex col gap-2">
                <h3 class="font-bold text-xl mb-2">System Status</h3>
                <div class="flex row items-center gap-2"><span class="text-accent">●</span> All systems operational</div>
                <button class="btn btn-primary rounded-full mt-2" onclick="NexusAuth.signOut()">Log Out</button>
            </div>
        </aside>
    </div>

    <div id="view-auth" class="flex col items-center justify-center h-full w-full bg-base">
        <div class="bg-surface p-8 rounded-lg border-all flex col gap-4 w-full" style="max-width: 400px;">
            <h1 class="text-xl font-bold text-center">ACCESS NEXUS</h1>
            <input type="email" id="auth-email" class="input-ghost border-b py-2" placeholder="Email">
            <input type="password" id="auth-password" class="input-ghost border-b py-2" placeholder="Password">
            <button class="btn btn-accent rounded-full w-full mt-2" onclick="NexusAuth.signIn()">ENTER SYSTEM</button>
            <p id="auth-error" class="text-accent text-center hidden"></p>
        </div>
    </div>
</body>
</html>
