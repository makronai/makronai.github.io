<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power — Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/power/app.css">
</head>
<body>

<!-- Toast Container -->
<div id="toasts"></div>

<!-- Landing Screen -->
<div id="landing" class="screen active">
  <div class="landing-bg"></div>
  <div class="landing-center">
    <div class="logo-mark">⚡</div>
    <h1 class="logo-text">Power</h1>
    <p class="logo-sub">Peer-to-peer voice, video & chat</p>

    <div class="card join-card">
      <div class="card-tabs">
        <button class="tab active" data-tab="create">Create Room</button>
        <button class="tab" data-tab="join">Join Room</button>
      </div>

      <div class="tab-panel active" id="tab-create">
        <p class="hint">Share your ID or invite link with others to connect.</p>
        <div class="id-display">
          <span id="my-id-display" class="mono">Generating...</span>
          <button class="icon-btn" id="copy-id-btn" title="Copy ID">⎘</button>
        </div>
        <div class="qr-row">
          <button class="btn-ghost" id="show-qr-btn">Show QR</button>
          <button class="btn-ghost" id="copy-link-btn">Copy Link</button>
        </div>
        <div id="qr-container" class="qr-box hidden"></div>
        <input type="text" id="display-name-create" class="input" placeholder="Your display name (optional)">
        <button class="btn-primary" id="go-host-btn">Open Room</button>
      </div>

      <div class="tab-panel" id="tab-join">
        <input type="text" id="peer-id-input" class="input" placeholder="Paste peer ID here">
        <div class="qr-row">
          <button class="btn-ghost" id="scan-qr-btn">📷 Scan QR</button>
        </div>
        <div id="qr-scanner-box" class="hidden">
          <video id="qr-video" autoplay playsinline></video>
          <canvas id="qr-canvas" hidden></canvas>
          <p class="hint">Point camera at QR code</p>
          <button class="btn-ghost" id="stop-scan-btn">Cancel</button>
        </div>
        <input type="text" id="display-name-join" class="input" placeholder="Your display name (optional)">
        <button class="btn-primary" id="go-join-btn">Join Room</button>
      </div>
    </div>
  </div>
</div>

<!-- Room Screen -->
<div id="room" class="screen">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo-small">⚡ Power</span>
      <button class="icon-btn" id="sidebar-toggle" title="Toggle sidebar">☰</button>
    </div>

    <div class="sidebar-section">
      <div class="section-label">YOUR ID</div>
      <div class="id-mini">
        <span id="room-my-id" class="mono truncate"></span>
        <button class="icon-btn sm" id="room-copy-id" title="Copy">⎘</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">PARTICIPANTS</div>
      <div id="participants-list" class="participants"></div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">NETWORK</div>
      <div id="network-info" class="network-info">
        <div class="net-row"><span>Ping</span><span id="ping-val" class="mono green">—</span></div>
        <div class="net-row"><span>Peers</span><span id="peers-count" class="mono">0</span></div>
        <div class="net-row"><span>Status</span><span id="conn-status" class="mono">Idle</span></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="btn-danger sm" id="leave-btn">Leave Room</button>
    </div>
  </div>

  <div class="main-area" id="main-area">
    <!-- Video Grid -->
    <div class="video-grid" id="video-grid">
      <div class="video-tile self-tile" id="self-tile">
        <video id="self-video" autoplay muted playsinline></video>
        <div class="tile-overlay">
          <span class="tile-name" id="self-name">You</span>
          <div class="tile-indicators">
            <span class="indicator" id="self-mic-ind" title="Mic">🎙</span>
            <span class="indicator" id="self-cam-ind" title="Camera">📷</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar" id="controls-bar">
      <div class="controls-group">
        <div class="ctrl-wrap">
          <button class="ctrl-btn active" id="mic-btn" title="Toggle Mic">
            <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button class="ctrl-arrow" id="mic-arrow" title="Select mic">▾</button>
        </div>
        <div class="ctrl-wrap">
          <button class="ctrl-btn active" id="cam-btn" title="Toggle Camera">
            <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          </button>
          <button class="ctrl-arrow" id="cam-arrow" title="Select camera">▾</button>
        </div>
        <button class="ctrl-btn" id="screen-btn" title="Share Screen">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
      </div>

      <div class="controls-center">
        <button class="ctrl-btn danger" id="end-btn" title="Leave">
          <svg viewBox="0 0 24 24"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.42 19.42 0 0 1 3.07 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 2 1.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L6.18 8.91a16 16 0 0 0 4.5 4.4z"/></svg>
        </button>
      </div>

      <div class="controls-group">
        <button class="ctrl-btn" id="chat-btn" title="Toggle Chat">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="ctrl-btn active" id="layout-btn" title="Layout">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Chat Panel -->
  <div class="chat-panel" id="chat-panel">
    <div class="chat-header">
      <span>Chat</span>
      <button class="icon-btn" id="close-chat-btn">✕</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-input-area">
      <button class="icon-btn" id="attach-btn" title="Attach file">📎</button>
      <input type="file" id="file-input" multiple hidden>
      <input type="text" id="chat-input" class="chat-input" placeholder="Message...">
      <button class="icon-btn send-btn" id="send-btn">➤</button>
    </div>
  </div>
</div>

<!-- Device Picker Dropdown -->
<div id="device-menu" class="device-menu hidden">
  <div class="device-list" id="device-list"></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="/app/power/app.js"></script>
</body>
</html>
